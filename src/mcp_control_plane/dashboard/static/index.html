<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mcp-control-plane</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class", theme: { extend: {} } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235b8def'/%3E%3Cpath d='M9 22V10l7 6 7-6v12' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body class="min-h-screen">
  <div class="flex min-h-screen">
    <!-- ===== Left nav ===== -->
    <aside class="w-60 flex-none border-r border-[var(--border)] bg-[var(--bg-1)] flex flex-col">
      <div class="px-5 py-5 border-b border-[var(--border)]">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:linear-gradient(180deg,#5b8def,#3f72d8)">
            <svg width="18" height="18" viewBox="0 0 32 32" fill="none"><path d="M9 22V10l7 6 7-6v12" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/></svg>
          </div>
          <div>
            <div class="font-bold text-[15px] leading-none tracking-tight">mcp<span class="text-[var(--text-mute)]">-</span>control-plane</div>
            <div class="text-[10.5px] text-[var(--text-mute)] mt-1 leading-tight">governance &amp; security for MCP</div>
          </div>
        </div>
      </div>

      <nav id="nav" class="p-3 flex flex-col gap-1 flex-1">
        <!-- nav items injected -->
      </nav>

      <div class="p-3 border-t border-[var(--border)]">
        <div id="health-pill" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-[var(--panel)] border border-[var(--border)] text-xs">
          <span id="health-dot" class="w-2 h-2 rounded-full bg-[var(--text-mute)]"></span>
          <span id="health-text" class="text-[var(--text-dim)]">connecting…</span>
        </div>
      </div>
    </aside>

    <!-- ===== Main ===== -->
    <div class="flex-1 min-w-0 flex flex-col">
      <!-- header -->
      <header class="h-14 flex-none border-b border-[var(--border)] bg-[var(--bg-1)]/80 backdrop-blur flex items-center justify-between px-6 sticky top-0 z-30">
        <div>
          <h1 id="view-title" class="font-semibold text-[15px] tracking-tight">Overview</h1>
          <p id="view-sub" class="text-[11px] text-[var(--text-mute)] leading-tight">The governance &amp; security control plane for MCP</p>
        </div>
        <div class="flex items-center gap-2">
          <button id="refresh-btn" class="btn btn-sm" title="Refresh">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v5h-5"/></svg>
            Refresh
          </button>
          <button id="token-btn" class="btn btn-sm" title="API token">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="13" r="4"/><path d="m10 10 9-9 3 3-3 3 2 2-3 3-2-2-3 3"/></svg>
            <span id="token-state">Token</span>
          </button>
        </div>
      </header>

      <!-- token popover -->
      <div id="token-pop" class="hidden absolute right-6 top-16 z-40 panel-flat p-4 w-80 shadow-2xl">
        <label class="lbl">API Token (Bearer)</label>
        <input id="token-input" class="inp mono" type="password" placeholder="paste mcpcp_token…" autocomplete="off" />
        <p class="text-[11px] text-[var(--text-mute)] mt-2 leading-snug">Stored in <span class="kbd">localStorage.mcpcp_token</span>. Sent as <span class="kbd">Authorization: Bearer</span> on every request.</p>
        <div class="flex gap-2 mt-3">
          <button id="token-save" class="btn btn-primary btn-sm flex-1">Save</button>
          <button id="token-clear" class="btn btn-sm">Clear</button>
        </div>
      </div>

      <main id="view" class="flex-1 overflow-y-auto p-6 max-w-[1400px] w-full"></main>
    </div>
  </div>

  <!-- drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <aside id="drawer" class="drawer"></aside>

  <!-- toasts -->
  <div id="toasts"></div>

  <script src="/static/app.js"></script>
</body>
</html>
