name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Test (pytest)
        run: pytest -q

  mcp-scan:
    # Dogfood: scan the example client configs and fail on high-severity findings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Safe fixtures must pass
        run: mcpcp scan --no-user --project examples/configs-safe --fail-on high
      - name: Unsafe fixtures must be flagged (negative test)
        run: |
          if mcpcp scan --ci --no-user --project examples/configs --fail-on high; then
            echo "::error::scanner failed to flag known-unsafe example configs"
            exit 1
          fi
          echo "scanner correctly flagged the unsafe example configs"
