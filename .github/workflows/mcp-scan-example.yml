# Example workflow you can copy into ANY repository to gate committed MCP configs.
# It fails the build if a high-severity MCP config issue (hardcoded secret,
# plaintext transport, shell-injection command, auto-approve bypass, ...) is found.
name: mcp-config-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mcp-control-plane
      - name: Scan repository MCP configs
        run: mcpcp scan --ci --no-user --project . --fail-on high
