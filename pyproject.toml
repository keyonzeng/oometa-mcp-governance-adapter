[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-control-plane"
version = "0.1.0"
description = "Governance & security control plane for Model Context Protocol (MCP) adoption: registry, gateway, policy engine, approvals, audit, and config scanner."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "mcp-control-plane contributors" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-security",
    "ai-governance",
    "llm",
    "agents",
    "policy-as-code",
    "gateway",
    "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/TWe1v3/mcp-control-plane"
Repository = "https://github.com/TWe1v3/mcp-control-plane"
Documentation = "https://github.com/TWe1v3/mcp-control-plane/tree/main/docs"
Issues = "https://github.com/TWe1v3/mcp-control-plane/issues"

[project.scripts]
mcpcp = "mcp_control_plane.cli.main:app"

[tool.hatch.build.targets.sdist]
# Keep the sdist lean: the dashboard screenshots (~4MB) are only needed for the
# rendered README on GitHub, not for installation.
exclude = ["docs/img/*.png"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_control_plane"]
# Dashboard static assets live inside the package dir and are included as
# package data automatically; artifacts ensures they ship even if git-ignored.
artifacts = ["src/mcp_control_plane/dashboard/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: Typer uses function-call defaults (typer.Option) by design.
# UP042: (str, Enum) is intentional for stable, JSON-friendly enum values.
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
